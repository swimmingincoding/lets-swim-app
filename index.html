<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lets Swim World Masters - 싱가포르 월마 대진표</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="Lets Swim World Masters - 싱가포르 월드마스터즈 챔피언십 경기 대진표 0.1초 모바일 검색, 마이팀 타임라인, 오프라인 PWA 지원">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lets Swim">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./src/index.css">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-logo" style="background: transparent; box-shadow: none;">
          <img src="./logo.png" alt="Lets Swim" style="width: 36px; height: 36px; object-fit: contain;">
        </div>
        <div class="brand-text">
          <h1>Lets Swim World Masters</h1>
          <button id="championshipSelectBtn" class="edition-pill" onclick="window.aquaApp && window.aquaApp.openChampionshipModal()" title="대회 선택">
            <span id="editionFlag">🇸🇬</span>
            <span id="editionTitle">2025 싱가포르</span>
            <span class="edition-arrow">▾</span>
          </button>
        </div>
      </div>
      <div class="header-status" style="display: flex; gap: 6px; align-items: center;">
        <button id="btnForceRefresh" class="status-badge" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); cursor: pointer; color: #fff; padding: 4px 8px;" onclick="window.aquaApp && window.aquaApp.forceUpdateData()" title="최신 데이터 동기화">
          🔄 동기화
        </button>
        <div id="connectionStatus" class="status-badge">
          <span class="status-dot"></span>
          <span id="statusText">온라인</span>
        </div>
      </div>
    </header>

    <!-- Swimming Pool Water Flow Ribbon -->
    <div class="water-wave-banner"></div>

    <!-- Main Scrollable Content -->
    <main class="main-view-container" id="mainContainer">
      <!-- Loading State -->
      <div id="initialLoader" class="state-container">
        <div class="state-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin-icon">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
          </svg>
        </div>
        <div class="state-title" id="loadingTitle">대진표 데이터 준비 중...</div>
        <p class="state-desc" id="loadingDesc">총 276페이지 14,000건의 대진표 데이터를 로컬에 구성하고 있습니다.</p>
      </div>

      <!-- 1. SEARCH VIEW -->
      <section id="viewSearch" class="view-section">
        <div class="search-container">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="선수명, 팀(클럽)명, 종목 검색..." autocomplete="off">
            <button id="clearSearchBtn" class="clear-search-btn" style="display: none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Quick Filters -->
          <div class="quick-filter-scroll" id="quickFilters">
            <button class="filter-chip accent-chip" data-query="LETS SWIM">★ LETS SWIM</button>
            <button class="filter-chip" data-query="SWIMON">SWIMON</button>
            <button class="filter-chip" data-query="MAD88">MAD88</button>
            <button class="filter-chip" data-query="50m Freestyle">50m 자유형</button>
            <button class="filter-chip" data-query="100m Freestyle">100m 자유형</button>
            <button class="filter-chip" data-query="50m Butterfly">50m 접영</button>
            <button class="filter-chip" data-query="4x50m">계영 (Relay)</button>
          </div>
        </div>

        <!-- Search Results List -->
        <div id="searchResultsList"></div>
      </section>

      <!-- 2. MY TEAM VIEW -->
      <section id="viewMyTeam" class="view-section">
        <div id="myTeamBanner" class="summary-banner">
          <div class="stat-item">
            <h3 id="myTeamCount">0</h3>
            <p>등록 팀원</p>
          </div>
          <div class="stat-item">
            <h3 id="myTeamRacesCount">0</h3>
            <p>총 레이스</p>
          </div>
          <div class="stat-item">
            <h3 id="myTeamRelaysCount">0</h3>
            <p>계영 출전</p>
          </div>
        </div>

        <div class="utility-actions-bar">
          <button id="copyTeamScheduleBtn" class="btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            단톡방 일정 복사
          </button>
          <button id="downloadCardBtn" class="btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            카드 이미지
          </button>
        </div>

        <!-- Day Filter Selector -->
        <div class="timeline-day-selector" id="myTeamDaySelector">
          <button class="day-tab-btn active" data-day="all">전체 일정</button>
          <button class="day-tab-btn" data-day="1">Day 1 (8/7 목)</button>
          <button class="day-tab-btn" data-day="2">Day 2 (8/8 금)</button>
          <button class="day-tab-btn" data-day="3">Day 3 (8/10 일)</button>
          <button class="day-tab-btn" data-day="4">Day 4 (8/11 월)</button>
          <button class="day-tab-btn" data-day="5">Day 5 (8/12 화)</button>
          <button class="day-tab-btn" data-day="6">Day 6 (8/13 수)</button>
          <button class="day-tab-btn" data-day="7" style="color: var(--accent-emerald);">Day 7 (8/14 목 계영)</button>
        </div>

        <!-- Team Timeline List -->
        <div id="myTeamTimelineList"></div>
      </section>

      <!-- 3. SCHEDULE VIEW -->
      <section id="viewSchedule" class="view-section">
        <div style="font-size: 0.74rem; color: var(--accent-gold); margin-bottom: 8px; padding: 5px 10px; background: rgba(255, 184, 0, 0.08); border-radius: 6px; border: 1px solid rgba(255, 184, 0, 0.2);">
          ℹ️ 8월 9일(토)은 싱가포르 국경일(National Day)로 전 경기 공식 휴식일입니다.
        </div>
        <div class="timeline-day-selector" id="scheduleDaySelector">
          <button class="day-tab-btn active" data-day="1">Day 1 (8/7 목)</button>
          <button class="day-tab-btn" data-day="2">Day 2 (8/8 금)</button>
          <button class="day-tab-btn" data-day="3">Day 3 (8/10 일)</button>
          <button class="day-tab-btn" data-day="4">Day 4 (8/11 월)</button>
          <button class="day-tab-btn" data-day="5">Day 5 (8/12 화)</button>
          <button class="day-tab-btn" data-day="6">Day 6 (8/13 수)</button>
          <button class="day-tab-btn" data-day="7" style="color: var(--accent-emerald);">Day 7 (8/14 목 계영)</button>
        </div>
        <div id="scheduleEventList"></div>
      </section>

      <!-- 4. EVENTS BROWSER VIEW -->
      <section id="viewEvents" class="view-section">
        <div class="quick-filter-scroll" id="eventCategoryFilters">
          <button class="filter-chip active" data-stroke="all">전체</button>
          <button class="filter-chip" data-stroke="Freestyle">자유형</button>
          <button class="filter-chip" data-stroke="Backstroke">배영</button>
          <button class="filter-chip" data-stroke="Breaststroke">평영</button>
          <button class="filter-chip" data-stroke="Butterfly">접영</button>
          <button class="filter-chip" data-stroke="Medley">혼영</button>
          <button class="filter-chip" data-stroke="4x50m">계영</button>
        </div>
        <div id="eventsList" style="margin-top: 12px;"></div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>검색</span>
      </button>

      <button class="nav-item" data-tab="myteam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>마이팀</span>
        <div id="navMyTeamBadge" class="nav-badge" style="display: none;">0</div>
      </button>

      <button class="nav-item" data-tab="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>일정표</span>
      </button>

      <button class="nav-item" data-tab="events">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>종목별</span>
      </button>
    </nav>

    <!-- Athlete / Details Bottom Sheet Modal -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div id="modalHeaderInfo">
            <h2 id="modalTitle" class="athlete-name" style="font-size: 1.35rem;">선수 상세</h2>
            <div id="modalSubTitle" class="athlete-sub">소속 클럽 정보</div>
          </div>
          <button id="modalCloseBtn" class="sheet-close-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="sheet-content" id="modalBody">
          <!-- Dynamic Content Loaded Here -->
        </div>
      </div>
    </div>

    <!-- Hidden Canvas for Image Card Generation -->
    <canvas id="shareCanvas" style="display: none;"></canvas>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <!-- Main JavaScript App -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
